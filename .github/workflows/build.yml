# pkg.xolang.org's build job (decision 0589). It has no secrets and a read
# only token: it reads the index feed, fetches each new version through
# proxy.xolang.org checked against sum.xolang.org, runs the released xo's
# `xo doc --json` with no network, and uploads the rendered pages as an
# artifact. The publish job uploads that artifact to the xo-pkgsite R2
# bucket with a token scoped to that bucket only (secrets R2_ACCESS_KEY_ID,
# R2_SECRET_ACCESS_KEY and R2_ENDPOINT, a secret so the run log masks the
# account id it names); it never checks out or runs
# module source, which is only ever parsed in build.
name: build

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      modules:
        description: "path@version list (space separated) to build instead of the feed"
        required: false
        default: ""
      std:
        description: "render the xo release's std"
        type: boolean
        default: false
      rebuild:
        description: "rebuild published versions instead of the feed: all, an SDK (aws, azure, gcp, openai) or a module path pattern"
        required: false
        default: ""
      stage:
        description: "rebuild stage: render (HTML from the stored doc JSON, minutes) or full (fetch and xo doc again)"
        type: choice
        options: [render, full]
        default: render
      stale:
        description: "rebuild only versions an older renderer (or, full, an older xo) made"
        type: boolean
        default: true
      shards:
        description: "rebuild jobs at once (1 to 16)"
        required: false
        default: "8"

permissions:
  contents: read

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    # the feed (or --module, --std); a rebuild has its own jobs below
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.rebuild == '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      built: ${{ steps.build.outputs.built }}
    env:
      XO_VERSION: ${{ vars.XO_VERSION || 'v0.49.1' }}
      # versions built per run; the rest wait for the next run (the job has 60 minutes)
      PKGSITE_MAX: ${{ vars.PKGSITE_MAX || '400' }}
      XO_SUMDB: ${{ vars.XO_SUMDB }}
      MODULES: ${{ inputs.modules }}
      STD: ${{ inputs.std }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Unit tests
        run: python3 -E -s -m unittest discover -s tests -t .
      - name: Install xo
        run: scripts/install-xo.sh "$XO_VERSION" "$RUNNER_TEMP/xo"
      - name: Std summaries
        run: XO_STD_DIR="$RUNNER_TEMP/xo/lib/xo/std" python3 -E -s -m unittest tests.test_std_summaries
      - name: Build
        id: build
        run: |
          if [ -z "$XO_SUMDB" ]; then
            echo "::notice::the repository variable XO_SUMDB (sum.xolang.org's verifier key) is not set; nothing built"
            exit 0
          fi
          set -- --xo "$RUNNER_TEMP/xo/bin/xo" --work "$RUNNER_TEMP/work" --site site --state state \
            --catalog https://pkg.xolang.org/catalog.json --sandbox unshare --advance --max "$PKGSITE_MAX"
          # --sandbox unshare runs xo doc with no network: an unprivileged
          # network namespace, else sudo's (xo dropped back to this user);
          # the build fails when neither works
          for m in $MODULES; do set -- "$@" --module "$m"; done
          if [ "$STD" = "true" ]; then set -- "$@" --std; fi
          python3 -E -s -m builder.build "$@"
          # --advance writes state/position.json (feed runs only); the
          # position is committed only after the publish job uploaded the site
          if [ -f site/catalog.json ]; then echo "built=1" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: site
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: state
          path: state/position.json
          if-no-files-found: ignore
          retention-days: 7

  rebuild-plan:
    # a rebuild (workflow_dispatch with rebuild set): the shard list. The
    # whole workflow shares one concurrency group, so a rebuild never runs
    # beside a feed build, and it never reads or writes state/position.json.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.rebuild != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      n: ${{ steps.plan.outputs.n }}
    env:
      SHARDS: ${{ inputs.shards }}
    steps:
      - id: plan
        run: |
          case $SHARDS in ''|*[!0-9]*) echo "::error::shards must be 1 to 16, not $SHARDS"; exit 1 ;; esac
          if [ "$SHARDS" -lt 1 ] || [ "$SHARDS" -gt 16 ]; then echo "::error::shards must be 1 to 16"; exit 1; fi
          echo "n=$SHARDS" >> "$GITHUB_OUTPUT"
          echo "shards=$(python3 -I -c 'import json,sys; print(json.dumps(list(range(int(sys.argv[1])))))' "$SHARDS")" >> "$GITHUB_OUTPUT"

  rebuild:
    # one shard: every Nth selected version. render reads each version's
    # stored doc JSON from pkg.xolang.org and runs no xo; full fetches and
    # runs xo doc (no network) again. Pages only: the catalog wide pages
    # come from rebuild-finish.
    needs: rebuild-plan
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.rebuild-plan.outputs.shards) }}
    env:
      XO_VERSION: ${{ vars.XO_VERSION || 'v0.49.1' }}
      XO_SUMDB: ${{ vars.XO_SUMDB }}
      REBUILD: ${{ inputs.rebuild }}
      STAGE: ${{ inputs.stage }}
      STALE: ${{ inputs.stale }}
      SHARD: ${{ matrix.shard }}/${{ needs.rebuild-plan.outputs.n }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Unit tests
        run: python3 -E -s -m unittest discover -s tests -t .
      - name: Install xo
        if: ${{ inputs.stage == 'full' }}
        run: scripts/install-xo.sh "$XO_VERSION" "$RUNNER_TEMP/xo"
      - name: Rebuild
        run: |
          set -- --site site --catalog https://pkg.xolang.org/catalog.json --rebuild "$REBUILD" --stage "$STAGE" --shard "$SHARD"
          if [ "$STALE" = "true" ]; then set -- "$@" --stale; fi
          if [ "$STAGE" = "full" ]; then
            [ -n "$XO_SUMDB" ] || { echo "::error::the repository variable XO_SUMDB is not set"; exit 1; }
            set -- "$@" --xo "$RUNNER_TEMP/xo/bin/xo" --work "$RUNNER_TEMP/work" --sandbox unshare
          fi
          python3 -E -s -m builder.build "$@"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rebuild-${{ matrix.shard }}
          path: site
          if-no-files-found: ignore
          retention-days: 3

  rebuild-finish:
    # the shards' pages as one site, their catalog parts folded into the
    # published catalog, and the catalog wide pages (home, versions, search)
    needs: rebuild
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      built: ${{ steps.finish.outputs.built }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: rebuild-*
          merge-multiple: true
          path: site
      - id: finish
        run: |
          python3 -E -s -m builder.build --site site --catalog https://pkg.xolang.org/catalog.json --finish-parts
          if [ -f site/catalog.json ]; then echo "built=1" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: site
          if-no-files-found: ignore
          retention-days: 7

  publish:
    # the build's pages to R2. No module source here: it checks out this
    # repository for the upload script only and downloads the artifact.
    # Only from main, never for a pull request (the workflow has no
    # pull_request trigger, and forks get no secrets).
    # (a feed build's or a rebuild's: one of the two runs, the other is skipped)
    needs: [build, rebuild-finish]
    if: ${{ !cancelled() && (needs.build.outputs.built == '1' || needs.rebuild-finish.outputs.built == '1') && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      published: ${{ steps.publish.outputs.published }}
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_BUCKET: xo-pkgsite
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/publish-r2.sh
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: ${{ runner.temp }}/site
      - name: Upload to R2
        id: publish
        run: |
          if [ -z "$R2_ACCESS_KEY_ID" ] || [ -z "$R2_SECRET_ACCESS_KEY" ] || [ -z "$R2_ENDPOINT" ]; then
            echo "::notice::the R2 secrets (R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_ENDPOINT) are not all set; nothing published"
            exit 0
          fi
          scripts/publish-r2.sh "$RUNNER_TEMP/site"
          echo "published=1" >> "$GITHUB_OUTPUT"

  heartbeat:
    # GitHub turns off scheduled workflows after 60 days with no commit:
    # one small commit a day keeps the schedule alive. It also commits the
    # feed position once the publish job uploaded the pages built from it,
    # so a failed or skipped publish is built again on the next run. It
    # reads only position.json from the build, never the pages.
    # a scheduled run, or a dispatched one that read the feed (no modules
    # named): both advance the position
    # (never a rebuild: the build job is skipped then)
    if: ${{ !cancelled() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.modules == '' && inputs.rebuild == '')) && needs.build.result == 'success' && needs.publish.result != 'failure' }}
    needs: [build, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.publish.outputs.published == '1'
        with:
          name: state
          path: ${{ runner.temp }}/state
      - name: Commit the published position and the day's heartbeat
        env:
          PUBLISHED: ${{ needs.publish.outputs.published }}
        run: |
          mkdir -p state
          msg=""
          day=$(date -u +%Y-%m-%d)
          if [ "$(cat state/heartbeat 2>/dev/null)" != "$day" ]; then
            echo "$day" > state/heartbeat
            msg="heartbeat $day"
          fi
          new="$RUNNER_TEMP/state/position.json"
          if [ "$PUBLISHED" = 1 ] && [ -f "$new" ]; then
            # only the position's own fields: since, heartbeat and failure counts
            python3 -I builder/position.py "$new"
            # a commit only when the position moved (its heartbeat field
            # changes every run)
            since() { python3 -I -c 'import json,sys; print(json.load(open(sys.argv[1])).get("since",""))' "$1" 2>/dev/null; }
            to=$(since "$new")
            if [ -n "$to" ] && [ "$to" != "$(since state/position.json)" ]; then
              cp "$new" state/position.json
              msg="${msg:+$msg, }position $to"
            fi
          fi
          [ -n "$msg" ] || exit 0
          git config user.name "pkgsite heartbeat"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state
          git commit -q -m "$msg"
          git push -q origin HEAD:main
